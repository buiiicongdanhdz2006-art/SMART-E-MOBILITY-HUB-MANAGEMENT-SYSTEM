# Run without PostgreSQL / MQTT:  mvn spring-boot:run -Dspring-boot.run.profiles=local
spring:
  datasource:
    url: jdbc:h2:file:./data/emobility;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

iot:
  mqtt:
    enabled: ${MQTT_ENABLED:false}
